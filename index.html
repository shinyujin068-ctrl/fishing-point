<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>낚시 포인트 관리</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f3f5f7;--card:#fff;--text:#121820;--muted:#68717d;--line:#dfe4e8;--dark:#101827;--accent:#1166cc;--a:#153a63;--b:#2e5f49;--c:#76512f}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}.wrap{max-width:760px;margin:auto;padding:0 12px 96px}.top{position:sticky;top:0;z-index:20;background:rgba(243,245,247,.96);backdrop-filter:blur(10px);padding:10px 0 8px}.title{display:flex;align-items:center;justify-content:space-between;gap:8px}.title h1{font-size:20px;margin:0}.tiny{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:800}.tab.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.tools{display:flex;gap:7px;margin-top:8px;overflow:auto}.tool{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px}
.courseNav{display:grid;gap:9px;margin:12px 0}.courseBtn{border:0;border-radius:16px;color:#fff;padding:14px;text-align:left;box-shadow:0 3px 10px #0002}.courseBtn b{display:block;font-size:17px}.courseBtn span{display:block;opacity:.9;font-size:13px;margin-top:3px}.ca{background:var(--a)}.cb{background:var(--b)}.cc{background:var(--c)}
.section{margin:18px 0 7px;padding:13px 14px;border-radius:15px;color:#fff}.section h2{font-size:18px;margin:0 0 4px}.section p{font-size:13px;margin:0;opacity:.92}.section.a{background:var(--a)}.section.b{background:var(--b)}.section.c{background:var(--c)}.section.custom{background:#4f5661}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;box-shadow:0 2px 7px #0000000d}.head{padding:13px 13px 9px}.row{display:flex;align-items:flex-start;gap:9px}.num{min-width:38px;height:38px;border-radius:12px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:900}.nm{font-size:17px;font-weight:900}.badge{display:inline-block;margin-left:6px;background:#ffdf66;color:#2e2600;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:900}.addr{margin-top:7px;font-size:14px;line-height:1.45}.meta{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:0 13px 12px}.act{border:0;border-radius:10px;padding:10px 6px;font-weight:800;background:#edf1f5}.act.primary{background:#0f65c9;color:#fff}.act.danger{color:#b32121}.imgs{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#e4e8ec}.imgs.one{grid-template-columns:1fr}.imgs img{width:100%;height:185px;object-fit:cover;display:block}.imgLabel{position:relative}.imgLabel span{position:absolute;left:7px;bottom:7px;background:#000b;color:#fff;font-size:11px;padding:4px 7px;border-radius:7px}
.fab{position:fixed;right:18px;bottom:20px;z-index:40;border:0;background:#0d63cc;color:#fff;border-radius:999px;padding:14px 18px;font-weight:900;box-shadow:0 6px 18px #0004}
.empty{background:#fff;border:1px dashed #bbc2ca;border-radius:14px;padding:25px;text-align:center;color:var(--muted)}
dialog{width:min(94vw,620px);border:0;border-radius:18px;padding:0;box-shadow:0 20px 70px #0006}dialog::backdrop{background:#0008}.modal{padding:16px}.modal h2{margin:0 0 12px}.grid{display:grid;gap:10px}.grid label{font-size:12px;color:var(--muted);font-weight:700}.grid input,.grid select,.grid textarea{width:100%;border:1px solid #ccd2d8;border-radius:10px;padding:11px;margin-top:4px;background:#fff}.grid textarea{min-height:74px;resize:vertical}.modalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.modalBtns button{border:0;border-radius:11px;padding:12px;font-weight:800}.save{background:#0d63cc;color:#fff}.cancel{background:#edf0f3}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}.photoHint{font-size:11px;color:var(--muted);margin-top:4px}
@media(max-width:480px){.wrap{padding-left:9px;padding-right:9px}.imgs img{height:160px}.actions{grid-template-columns:1fr 1fr}.actions .edit{grid-column:span 2}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="title"><div><h1>낚시 포인트 관리</h1><div class="tiny">휴대폰 개인용 · 주소복사 · 티맵 · 사진 · 백업</div></div><button class="tool" onclick="showManage()">관리</button></div>
<div class="tabs"><button id="tabFresh" class="tab on" onclick="setCat('freshwater')">민물</button><button id="tabSea" class="tab" onclick="setCat('sea')">바다</button></div>
<div class="tools"><button class="tool" onclick="exportData()">백업 저장</button><button class="tool" onclick="document.getElementById('importFile').click()">백업 복원</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="tool" onclick="scrollToTop()">맨 위</button></div></div>
<div id="courseNav" class="courseNav"></div><div id="list"></div></div>
<button class="fab" onclick="openForm()">+ 포인트 추가</button><div id="toast" class="toast"></div>
<dialog id="formDlg"><form class="modal" method="dialog" onsubmit="saveForm(event)"><h2 id="formTitle">포인트 추가</h2><div class="grid">
<label>카테고리<select id="fCat"><option value="freshwater">민물</option><option value="sea">바다</option></select></label>
<label>번호<input id="fId" type="number" min="1" placeholder="예: 16"></label>
<label>포인트명<input id="fName" required placeholder="예: 대호만 ○○포인트"></label>
<label>주소<input id="fAddr" required placeholder="티맵에서 검색할 주소"></label>
<label>코스<select id="fCourse"><option value="A">A · 주력코스</option><option value="B">B · 연속탐색</option><option value="C">C · 기타탐색</option><option value="D">D · 새 코스</option></select></label>
<label>지역<input id="fArea" placeholder="예: 당진포리"></label><label>주차<input id="fParking" placeholder="예: 주차장 좋음"></label>
<label>메모<textarea id="fNote" placeholder="진입로, 낚시구역 등"></textarea></label>
<label>지도 사진<input id="fMap" type="file" accept="image/*"><div class="photoHint">휴대폰 사진첩에서 선택 가능</div></label>
<label>주차 사진<input id="fParkingImg" type="file" accept="image/*"></label></div>
<div class="modalBtns"><button class="cancel" type="button" onclick="formDlg.close()">취소</button><button class="save" type="submit">저장</button></div></form></dialog>
<dialog id="manageDlg"><div class="modal"><h2>사이트 관리</h2><div class="grid"><button class="tool" onclick="exportData()">전체 데이터 백업(JSON)</button><button class="tool" onclick="document.getElementById('importFile').click();manageDlg.close()">백업 파일 복원</button><button class="tool" onclick="if(confirm('직접 추가/수정한 내용을 모두 지우고 최초 상태로 되돌릴까요?')) resetAll()">최초 상태로 복원</button></div><div class="modalBtns"><button class="cancel" onclick="manageDlg.close()">닫기</button><button class="save" onclick="showInstallHelp()">홈 화면 사용법</button></div></div></dialog>
<script>
const DEFAULT_POINTS=[{"id":1,"name":"감옥골수로","address":"충남 당진시 고대면 옥현리 1015","course":"C","area":"옥현리","parking":"사진 추후 추가","note":"파란색 주차 · 노란색 진입로 · 빨간색 낚시구역","category":"freshwater","mapImage":"assets/p01_map.webp","parkingImage":""},{"id":2,"name":"큰골 수로","address":"충남 당진시 고대면 옥현리 1001","course":"C","area":"옥현리","parking":"사진 추후 추가","note":"곶부리 형태 연안 낚시구역","category":"freshwater","mapImage":"assets/p02_map.webp","parkingImage":""},{"id":3,"name":"딴산삼거리","address":"충남 당진시 고대면 옥현리 830-6","course":"C","area":"옥현리","parking":"사진 추후 추가","note":"대호만 본류 서쪽 연안","category":"freshwater","mapImage":"assets/p03_map.webp","parkingImage":""},{"id":4,"name":"딴산","address":"충남 당진시 고대면 옥현리 산 209","course":"C","area":"옥현리","parking":"도로 우측 비포장 갓길","note":"곶부리와 좌우 본류 연안","category":"freshwater","mapImage":"assets/p04_map.webp","parkingImage":"assets/p04_parking.webp"},{"id":5,"name":"독창골 수로","address":"충남 당진시 고대면 옥현리 963","course":"C","area":"옥현리","parking":"도로 옆 넓은 비포장 공간","note":"수로 입구와 본류가 만나는 연안","category":"freshwater","mapImage":"assets/p05_map.webp","parkingImage":"assets/p05_parking.webp"},{"id":6,"name":"금산미산 수로","address":"충남 당진시 고대면 당진포리 2116","course":"B","area":"당진포리","parking":"농로 폭 넓어진 구간","note":"수로 입구와 본류가 만나는 연안","category":"freshwater","mapImage":"assets/p06_map.webp","parkingImage":"assets/p06_parking.webp"},{"id":7,"name":"안대산 수로","address":"충남 당진시 고대면 당진포리 2099","course":"B","area":"당진포리","parking":"농로 가장자리 확장 공간","note":"수로 입구 주변","category":"freshwater","mapImage":"assets/p07_map.webp","parkingImage":"assets/p07_parking.webp"},{"id":8,"name":"안쟁이길","address":"충남 당진시 고대면 당진포리 2093","course":"B","area":"당진포리","parking":"전봇대 옆 농로 교차부","note":"대호만 본류 연안","category":"freshwater","mapImage":"assets/p08_map.webp","parkingImage":"assets/p08_parking.webp"},{"id":9,"name":"온동매운탕","address":"충남 당진시 고대면 당진포리 2092","course":"B","area":"당진포리","parking":"콘크리트 도로 가장자리","note":"대호만 본류 서쪽 연안","category":"freshwater","mapImage":"assets/p09_map.webp","parkingImage":"assets/p09_parking.webp"},{"id":10,"name":"감산매운탕","address":"충남 당진시 고대면 당진포리 2084","course":"B","area":"당진포리","parking":"논둑 농로 폭 확보 구간","note":"대호만 본류 직선형 연안","category":"freshwater","mapImage":"assets/p10_map.webp","parkingImage":"assets/p10_parking.webp"},{"id":11,"name":"어선득호","address":"충남 당진시 고대면 당진포리 2080","course":"B","area":"당진포리","parking":"좋음 · 넓은 흙/자갈 공터","note":"대호만 본류 연안","category":"freshwater","mapImage":"assets/p11_map.webp","parkingImage":"assets/p11_parking.webp"},{"id":12,"name":"대호대교 캠핑장","address":"충청남도 당진시 고대면 대호로 953","course":"A","area":"당진포리","parking":"제일 좋음 · 대호대교 아래 넓은 포장공간","note":"농막 근거리 주력 코스 START","start":true,"category":"freshwater","mapImage":"assets/p12_map.webp","parkingImage":"assets/p12_parking.webp"},{"id":13,"name":"석문양수장","address":"충남 당진시 고대면 당진포리 2160-1","course":"A","area":"당진포리","parking":"지도/주차사진 저장","note":"슬로프 포함 · 본류 탐색","category":"freshwater","mapImage":"assets/p13_map.webp","parkingImage":"assets/p13_parking.webp"},{"id":14,"name":"송전탑","address":"충남 당진시 고대면 당진포리 1883-1","course":"A","area":"당진포리","parking":"자갈 농로 주차공간","note":"송전탑 인근 본류 연안","category":"freshwater","mapImage":"assets/p14_map.webp","parkingImage":"assets/p14_parking.webp"},{"id":15,"name":"노적봉","address":"충청남도 당진시 고대면 해창길 114","course":"A","area":"당진포리","parking":"좋음 · 건물 옆 도로 갓길","note":"농막 근거리 본류","category":"freshwater","mapImage":"assets/p15_map.webp","parkingImage":"assets/p15_parking.webp"}];
const KEY='fishingPointManager_v3';let currentCat='freshwater', editKey=null;
const clone=x=>JSON.parse(JSON.stringify(x));
function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(DEFAULT_POINTS)}catch(e){return clone(DEFAULT_POINTS)}}
let points=load(); function persist(){localStorage.setItem(KEY,JSON.stringify(points))}
const $=id=>document.getElementById(id); function toast(t){let x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function setCat(c){currentCat=c;$('tabFresh').classList.toggle('on',c==='freshwater');$('tabSea').classList.toggle('on',c==='sea');render()}
const courseMeta={A:['COURSE A · 농막 근거리 주력','12 → 13 → 14 → 15 · 가까우면서 여러 포인트를 빠르게 이동','a'],B:['COURSE B · 당진포리 연속탐색','6 → 7 → 8 → 9 → 10 → 11','b'],C:['COURSE C · 옥현리 탐색','1 → 2 → 3 → 4 → 5','c'],D:['COURSE D · 추가 포인트','직접 추가한 포인트를 묶어 관리','custom']};
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){let arr=points.filter(p=>p.category===currentCat);let courses=[...new Set(arr.map(p=>p.course||'D'))];courses.sort();$('courseNav').innerHTML=courses.map(c=>{let m=courseMeta[c]||[`COURSE ${esc(c)}`,'사용자 코스','custom'];return `<button class="courseBtn c${m[2]}" onclick="document.getElementById('course-${esc(c)}').scrollIntoView({behavior:'smooth',block:'start'})"><b>${m[0]}</b><span>${m[1]}</span></button>`}).join('');if(!arr.length){$('list').innerHTML='<div class="empty">아직 등록된 포인트가 없습니다.<br>아래 + 포인트 추가로 등록하세요.</div>';return}
let html='';for(const c of courses){let m=courseMeta[c]||[`COURSE ${esc(c)}`,'사용자 코스','custom'];let list=arr.filter(p=>(p.course||'D')===c).sort((a,b)=>(a.id||9999)-(b.id||9999));html+=`<div id="course-${esc(c)}" class="section ${m[2]}"><h2>${m[0]}</h2><p>${m[1]}</p></div>`;html+=list.map(card).join('')} $('list').innerHTML=html}
function card(p){let imgs='';if(p.mapImage||p.parkingImage){let cnt=(p.mapImage?1:0)+(p.parkingImage?1:0);imgs=`<div class="imgs ${cnt===1?'one':''}">${p.mapImage?`<div class="imgLabel"><img loading="lazy" src="${p.mapImage}" onclick="window.open(this.src)"><span>포인트 지도</span></div>`:''}${p.parkingImage?`<div class="imgLabel"><img loading="lazy" src="${p.parkingImage}" onclick="window.open(this.src)"><span>주차공간</span></div>`:''}</div>`}return `<article class="card"><div class="head"><div class="row"><div class="num">${String(p.id||'-').padStart(2,'0')}</div><div><div class="nm">${esc(p.name)}${p.start?'<span class="badge">START</span>':''}</div><div class="addr">${esc(p.address)}</div><div class="meta">주차: ${esc(p.parking||'-')}<br>${esc(p.note||'')}</div></div></div></div><div class="actions"><button class="act primary" onclick='openTmap(${JSON.stringify(p.address)})'>티맵 열기</button><button class="act" onclick='copyAddr(${JSON.stringify(p.address)})'>주소 복사</button><button class="act edit" onclick="editPoint('${p._key||'d'+p.id}')">수정</button><button class="act danger" onclick="deletePoint('${p._key||'d'+p.id}')">삭제</button></div>${imgs}</article>`}
function copyAddr(a){navigator.clipboard?.writeText(a).then(()=>toast('주소 복사됨')).catch(()=>{let t=document.createElement('textarea');t.value=a;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('주소 복사됨')})}
function openTmap(a){copyAddr(a);location.href='tmap://search?name='+encodeURIComponent(a);setTimeout(()=>toast('티맵이 안 열리면 복사된 주소를 붙여넣으세요'),1000)}
function nextId(cat){let ids=points.filter(p=>p.category===cat).map(p=>Number(p.id)||0);return Math.max(0,...ids)+1}
function openForm(k=null){editKey=k;let p=k?points.find(x=>(x._key||'d'+x.id)===k):null;$('formTitle').textContent=p?'포인트 수정':'포인트 추가';$('fCat').value=p?.category||currentCat;$('fId').value=p?.id||nextId($('fCat').value);$('fName').value=p?.name||'';$('fAddr').value=p?.address||'';$('fCourse').value=p?.course||'D';$('fArea').value=p?.area||'';$('fParking').value=p?.parking||'';$('fNote').value=p?.note||'';$('fMap').value='';$('fParkingImg').value='';$('formDlg').showModal()}
function editPoint(k){openForm(k)}function deletePoint(k){let p=points.find(x=>(x._key||'d'+x.id)===k);if(!p)return;if(!confirm(`${p.name} 포인트를 삭제할까요?`))return;points=points.filter(x=>(x._key||'d'+x.id)!==k);persist();render();toast('삭제되었습니다')}
async function fileToData(file){if(!file)return '';let data=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});return await shrink(data)}
function shrink(data){return new Promise(res=>{let im=new Image();im.onload=()=>{let max=1200,s=Math.min(1,max/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=data})}
async function saveForm(e){e.preventDefault();let existing=editKey?points.find(x=>(x._key||'d'+x.id)===editKey):null;let map=await fileToData($('fMap').files[0]),park=await fileToData($('fParkingImg').files[0]);let p={...(existing||{}),_key:existing?existing._key:('u'+Date.now()),category:$('fCat').value,id:Number($('fId').value)||nextId($('fCat').value),name:$('fName').value.trim(),address:$('fAddr').value.trim(),course:$('fCourse').value,area:$('fArea').value.trim(),parking:$('fParking').value.trim(),note:$('fNote').value.trim(),mapImage:map||existing?.mapImage||'',parkingImage:park||existing?.parkingImage||'',start:existing?.start||false};if(existing){let i=points.indexOf(existing);points[i]=p}else points.push(p);try{persist()}catch(err){alert('사진 용량이 커서 브라우저 저장공간을 초과했습니다. 사진을 줄이거나 백업 후 일부 사진을 삭제해주세요.');return}$('formDlg').close();currentCat=p.category;setCat(currentCat);toast('저장되었습니다')}
function showManage(){$('manageDlg').showModal()}function exportData(){let blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),points},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='낚시포인트_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('백업 파일 저장')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.points))throw 0;points=d.points;persist();render();toast('백업 복원 완료')}catch(x){alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};r.readAsText(f)}
function resetAll(){points=clone(DEFAULT_POINTS);persist();render();$('manageDlg').close();toast('최초 상태로 복원됨')}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}function showInstallHelp(){alert('HTTPS 주소로 배포한 뒤 휴대폰 브라우저에서 열고, 브라우저 메뉴의 “홈 화면에 추가”를 누르면 앱처럼 사용할 수 있습니다.');$('manageDlg').close()}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
